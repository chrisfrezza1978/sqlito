<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLito</title>
<meta name="theme-color" content="#1E6BFF">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<script src="config.js"></script>
<script src="js/somente-desktop.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: brincalhão e encorajador, como um bom app de idiomas — frases curtas, comemoração a cada acerto.
   IDEA: um negócio inteiro como trilha (hotel, clínica veterinária, cooperativa agro, loja virtual); cada setor é uma etapa do SQL.
   PICTURE: o SQLito, robozinho menta "Mestre dos Dados", que evolui com o aluno (Estagiário → DBA Supremo) e reage a cada resposta.
   COLOUR and TYPE: menta dominante, cor própria por etapa, ouro para XP; Nunito arredondada + JetBrains Mono no código.
   LAYOUT: trilha vertical em zigue-zague, lição em tela cheia com rodapé de feedback, navegação inferior mobile-first. */
:root{color-scheme:light dark;
--mint:#1E6BFF;--mint-d:#1650D0;--mint-dd:#0F3A8A;--mint-l:light-dark(#E6EEFF,#142A52);
--bg:light-dark(#F4F7FC,#0A1426);--card:light-dark(#FFFFFF,#111E36);--ink:light-dark(#0B1F3A,#E6EEFA);
--mute:light-dark(#5A6B85,#93A6C4);--line:light-dark(#DCE5F3,#1F3254);
--ok-ink:light-dark(#0F3A8A,#7FB0FF);--bad-ink:light-dark(#B3262D,#FF8C90);
--bad:#F2545B;--bad-d:#C93A41;--bad-l:light-dark(#FFE4E5,#3B1C1E);--good-l:light-dark(#DCE8FF,#12274A);
--gold:#FF7A1A;--gold-d:#D35F00;--lock:light-dark(#E9ECF1,#232B37);--lock-d:light-dark(#CDD3DC,#1A212B);--ativa:#1E6BFF;--ativa-d:#1546B8;--menta:#3EB489;--menta-d:#2A9A71;
--u:var(--mint);--ud:var(--mint-dd);--ff:'Nunito',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--ff);overflow-x:clip;padding-bottom:88px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.mute{color:var(--mute)}
/* topo */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top .in{max-width:680px;margin:auto;display:flex;align-items:center;gap:4px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;margin-right:auto;white-space:nowrap}
.brand .sq{width:34px}
.brand b{color:var(--ok-ink)}
@media(max-width:440px){.brand .bt{display:none}}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:6px 7px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.hit{animation:hit .5s}
@keyframes hit{30%{transform:scale(1.35)}60%{transform:scale(.9)}}
#view{max-width:680px;margin:auto;padding:16px}
/* botões */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border:0;border-radius:16px;background:var(--mint);color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--mint-dd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--mint-dd)}
.btn:disabled{background:var(--lock);color:var(--mute);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--ok-ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn svg{width:20px;height:20px}
.lnk{background:none;border:0;color:var(--ok-ink);font-weight:800;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:6px}
.lnk svg{width:18px;height:18px}
/* herói */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--u);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 var(--ud);margin-bottom:28px}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero .sq{width:118px}
.hero small{font-weight:800;opacity:.92}
.hero h1{margin:2px 0 6px;font-size:clamp(25px,5.4vw,34px);line-height:1.06;font-weight:900;text-wrap:balance}
.hero p{margin:0 0 14px;font-weight:600;opacity:.95}
.hero .btn{position:relative;z-index:1;background:#fff;color:var(--ud);box-shadow:0 4px 0 rgba(0,0,0,.18)}
@media(max-width:420px){.hero{grid-template-columns:1fr;text-align:center}.hero .sq{width:104px;margin:auto}}
/* trilha */
.ban{display:flex;align-items:center;gap:14px;background:var(--u);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--ud)}
.ban small{display:block;font-weight:800;opacity:.92;font-size:13px}
.ban h2{margin:0;font-size:25px;line-height:1.1;font-weight:900}
.ban p{margin:4px 0 0;font-size:14px;font-weight:700;opacity:.95}
.ban .ic{flex:none;width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-left:auto}
.ban .ic svg{width:32px;height:32px}
.abre{display:inline-flex;align-items:center;margin:8px 0 0 8px;border:0;border-radius:99px;background:rgba(255,255,255,.92);color:var(--ud);font:800 13px var(--ff);padding:4px 12px;min-height:32px}
.ban.locked .abre{background:var(--card);color:var(--mute)}
.gap{height:18px}
.ban.locked{background:var(--lock);color:var(--mute);box-shadow:0 5px 0 var(--lock-d)}
.ban.locked .ic{background:light-dark(rgba(255,255,255,.6),rgba(255,255,255,.08))}
.ban.feita{color:#0B1F3A}.ban.feita .ic{background:rgba(255,255,255,.35)}.ban.feita .prog{background:rgba(255,255,255,.4)}
.prog{font-size:13px;font-weight:900;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;display:inline-block;margin-top:8px}
.path{display:flex;flex-direction:column;align-items:center;gap:24px;padding:30px 0 8px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x))}
.nb{width:78px;height:72px;border-radius:50%;border:0;background:var(--u);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;color:#fff}
.nb:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.nb svg{width:34px;height:34px}
.node.lock .nb{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--mute)}
.node.done .nb{background:var(--menta);box-shadow:0 7px 0 var(--menta-d)}
.node.cur .nb{animation:pulse 1.8s infinite}
/* selo no canto do ícone da aula: cadeado (bloqueada) ou ✓ (concluída) */
.nb{position:relative}.nb .sel{position:absolute;top:-3px;right:-3px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mute);box-shadow:0 0 0 2.5px var(--lock-d)}
.nb .sel svg{width:15px;height:15px}.nb .sel.ok{color:var(--menta-d);box-shadow:0 0 0 2.5px var(--menta-d)}
@keyframes pulse{0%{box-shadow:0 7px 0 var(--ud),0 0 0 0 color-mix(in srgb,var(--u) 55%,transparent)}100%{box-shadow:0 7px 0 var(--ud),0 0 0 20px transparent}}
.trophy .nb{border-radius:24px;width:88px}
.lbl{font-size:13px;font-weight:800;color:var(--mute);max-width:140px;text-align:center;line-height:1.2}
.tip{position:absolute;top:-46px;z-index:2;background:var(--card);border:2px solid var(--line);color:var(--ink);font-weight:900;padding:6px 12px;border-radius:12px;white-space:nowrap;font-size:14px;animation:bob 1.8s ease-in-out infinite}
.tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.side{position:absolute;top:-6px;width:84px;pointer-events:none}
.side.r{left:calc(100% + 14px)}.side.l{right:calc(100% + 14px)}
.gate{display:flex;align-items:center;gap:10px;color:var(--mute);font-weight:800;font-size:14px;margin:18px 0 22px;white-space:nowrap}
.gate::before,.gate::after{content:"";flex:1;border-top:3px dashed var(--line)}
/* SQLito, o Mestre dos Dados */
.sq{display:block;overflow:visible;width:100%;height:auto}
.sq .bd{transform-origin:60px 124px}
.sq .lamp{animation:lamp 1.8s ease-in-out infinite}
.sq.idle .bd{animation:bob 2.6s ease-in-out infinite}
.sq.idle .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.sq.happy .bd{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}
.sq.happy .al{transform-origin:37px 88px;animation:wave .3s ease-in-out 6 alternate}
.sq.happy .ar{transform-origin:83px 88px;animation:wave2 .3s ease-in-out 6 alternate}
.sq.sad .bd{animation:droop .9s ease forwards}
.sq.shock .bd{animation:shake .45s ease 2}
.sq.shock .lamp{animation:lamp .25s infinite}
.sq.sleepy .bd{animation:snore 3.2s ease-in-out infinite}
.sq .zz{animation:zz 2.6s ease-in-out infinite}
.sq.jedi .bd{animation:levit 2.2s ease-in-out infinite}
.sq .aura{transform-origin:60px 70px;animation:aura 1.8s ease-in-out infinite}
.sq .gl{animation:glow 2.2s ease-in-out infinite}
@keyframes lamp{50%{opacity:.35}}
@keyframes snore{50%{transform:translateY(3px) rotate(-3deg)}}
@keyframes zz{0%{transform:translate(0,6px);opacity:0}40%{opacity:1}100%{transform:translate(6px,-8px);opacity:0}}
@keyframes levit{50%{transform:translateY(-10px)}}
@keyframes aura{50%{transform:scale(1.08);opacity:.45}}
@keyframes glow{50%{opacity:.35}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-24px) scale(.94,1.07)}62%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes wave{to{transform:rotate(55deg)}}
@keyframes wave2{to{transform:rotate(-55deg)}}
@keyframes droop{25%{transform:translateX(-6px) rotate(-4deg)}50%{transform:translateX(6px) rotate(4deg)}100%{transform:translateY(5px) scale(1.04,.95)}}
/* lição */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#lesson[hidden]{display:none}
.lhead{display:flex;align-items:center;gap:12px;width:100%;max-width:760px;margin:0 auto;padding:12px 16px}
.x{flex:none;width:44px;height:44px;border:0;background:none;border-radius:12px;color:var(--mute);display:grid;place-items:center}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--u);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
.lbody{flex:1;overflow-y:auto;width:100%;max-width:760px;margin:0 auto;padding:6px 18px 28px}
.lfoot{border-top:2px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));transition:background .2s}
.lfoot .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fb{flex:1 1 280px;display:none;align-items:center;gap:12px}
.lfoot.ok{background:var(--good-l);border-color:transparent}.lfoot.bad{background:var(--bad-l);border-color:transparent}
.lfoot.ok .fb,.lfoot.bad .fb{display:flex}
.fb .sq{width:66px;flex:none}
.fb h3{margin:0;font-size:22px;font-weight:900;line-height:1.1}
.lfoot.ok h3{color:var(--ok-ink)}.lfoot.bad h3{color:var(--bad-ink)}
.fb p{margin:3px 0 0;font-size:14px;font-weight:700}
.fb pre{margin:6px 0 0;padding:8px 10px;font-size:13px;max-height:120px}
#go{flex:0 0 auto;min-width:190px;margin-left:auto}
.lfoot.bad #go{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
@media(max-width:600px){#go{width:100%}}
.kind{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;color:var(--u);margin-top:8px}
.kind svg{width:18px;height:18px}
.q h2{font-size:clamp(21px,4.6vw,27px);line-height:1.2;font-weight:900;margin:6px 0 18px;text-wrap:balance}
.say{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:end;margin:8px 0 18px}
.say .sq{width:98px}
.bub{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700}
.bub::before{content:"";position:absolute;left:-9px;bottom:24px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.card p{margin:0 0 10px}.card ul{margin:0 0 6px;padding-left:20px}.card li{margin:5px 0}
code{font-family:var(--mono);background:var(--mint-l);color:var(--ok-ink);padding:1px 6px;border-radius:6px;font-size:.88em;overflow-wrap:anywhere}
pre.sql{font-family:var(--mono);background:#0B1F3A;color:#DCE7FA;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;overflow-x:auto;margin:12px 0;white-space:pre}
.kw{color:#7FB0FF;font-weight:700}.str{color:#FFB27A}.num{color:#FFA3AD}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:700}
.opt.mono span:last-child{font-family:var(--mono);font-size:14px}
.opt .n{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mute)}
.opt.sel{border-color:var(--mint);background:var(--mint-l);box-shadow:0 4px 0 var(--mint)}
.opt.sel .n{border-color:var(--mint);color:var(--ok-ink)}
.opt.right{border-color:var(--mint);background:var(--good-l);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);box-shadow:0 4px 0 var(--bad)}
.slots{min-height:122px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 14px;margin-bottom:18px;background:repeating-linear-gradient(transparent 0 56px,var(--line) 56px 58px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{font-family:var(--mono);font-weight:700;font-size:15px;min-height:46px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);animation:pop .18s ease}
.tok.used{color:transparent;background:var(--lock);box-shadow:none;border-color:transparent;pointer-events:none}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.lockd .opts,.lockd .bank,.lockd .slots,.lockd .chips{pointer-events:none}
.ed{display:block;width:100%;min-height:150px;resize:vertical;border-radius:16px;border:2px solid var(--line);background:#0B1F3A;color:#E6EEFA;caret-color:var(--mint);padding:14px;font:500 16px/1.55 var(--mono)}
.ed:focus{border-color:var(--mint);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px}
.chip{flex:none;min-height:40px;padding:6px 11px;border-radius:10px;border:2px solid var(--line);background:var(--card);font:700 13px var(--mono);white-space:nowrap}
@media(max-width:600px){.chips{gap:5px}.chip{min-height:36px;padding:4px 9px;font-size:12px;border-radius:9px}}
.row{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hint{margin-top:8px;padding:10px 12px;border-radius:12px;background:light-dark(#FFF1E6,#3A2414);font-weight:700;font-size:14px}
.res{margin-top:12px}
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--mint-l);font-weight:900;font-size:13px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.null{color:var(--mute);font-style:italic}
.cap{font-size:13px;color:var(--mute);margin:6px 2px 0;font-weight:700}
.msgs{background:#0B1F3A;color:#CFE0FF;border-radius:12px;padding:10px 12px;font:600 13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
/* tutor */
.sheet.tut{text-align:left;max-width:560px}
.tut-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}.tut-h .sq,.tut-h>svg,.tut-h>div:first-child{flex:none;width:64px}.tut-h h3{margin:0}.tut-h p{margin:0}
.tut-b{min-height:110px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0 14px;background:light-dark(#F7F9FD,#0F1C33)}
.tut-txt p{margin:0 0 8px;font-weight:600;line-height:1.55}.tut-txt code,.dl code{font:600 .92em var(--mono);background:var(--mint-l);padding:1px 5px;border-radius:6px}
.tut-nota{margin:8px 0 0;font-size:12.5px;font-weight:700;color:var(--mute)}
.tut-dots{display:flex;gap:6px;justify-content:center;padding:18px 0 6px}.tut-dots i{width:10px;height:10px;border-radius:50%;background:var(--mint);animation:pulo 1s infinite ease-in-out}
.tut-dots i:nth-child(2){animation-delay:.15s}.tut-dots i:nth-child(3){animation-delay:.3s}
@keyframes pulo{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.tutorB{margin-top:6px}
/* projeto final / portfólio */
.pj-top{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 18px 12px;margin:10px 0 14px}.pj-top .ey{display:flex;gap:6px;align-items:center;margin:0;font-weight:900;color:var(--ok-ink)}.pj-top .ey svg{width:18px;height:18px}
.pj-top .h1{margin:4px 0}.pj-top p{margin:6px 0}
.pj-prog{height:12px;border-radius:99px;background:var(--lock);overflow:hidden;margin-top:10px}.pj-prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.pj-lock{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.pj-lock>svg{flex:none;width:26px;height:26px;color:var(--mute)}.pj-lock p{margin:2px 0 0}
.pj-t{border:2px solid var(--line);border-radius:18px;background:var(--card);margin:10px 0;overflow:hidden}.pj-t.on{border-color:var(--mint)}
.pj-th{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:0;background:none;color:var(--ink);font:800 16px var(--ff);text-align:left}
.pj-th .n{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--lock);font-weight:900}.pj-th .n svg{width:18px;height:18px}
.pj-t.ok .pj-th .n{background:var(--mint);color:#fff}.pj-th b{flex:1}.pj-th small{color:var(--mute);font-weight:800}.pj-t.ok .pj-th small{color:var(--ok-ink)}
.pj-tb{padding:0 14px 14px}.pj-tb>p:first-child{margin:0 0 10px;font-weight:600}
.pj-ins{display:block;margin-top:12px}.pj-ins small{color:var(--mute);font-weight:700}
.pj-ins textarea{display:block;width:100%;min-height:76px;margin-top:6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:600 15px/1.45 var(--ff);resize:vertical}
.pj-ins textarea:disabled{opacity:.55}
.pj-bad{margin-top:10px}.pj-pub{margin-top:18px}
.pj-link{margin-top:12px;padding:12px;border-radius:14px;background:var(--mint-l)}.pj-link code{display:block;font:700 14px var(--mono);overflow-wrap:anywhere;margin-bottom:8px;background:none;padding:0}
.btn.li{background:#0A66C2;box-shadow:0 4px 0 #084B8E;color:#fff}
.pj-frame{width:100%;height:min(70vh,720px);border:2px solid var(--line);border-radius:14px;background:#fff;margin:8px 0 12px}

  const ord=/order\s+by/i.test(strip(q.check||q.a)),ok=sig(exp,ord)===sig(got,ord);
  if(ok&&falta.length)return{ok:false,err:`O resultado bateu, mas este exercício pede o uso de ${falta.join(', ')}.`};
  if(!ok&&exp)return{ok,cmp:{exp,got,ord,check:q.check||'',diag:diagnostico(exp,got,ord)}};

}

const celSig=v=>v==null?'∅':typeof v==='number'?String(Math.round(v*100)/100):String(v);

function diagnostico(exp,got,ord){
 const d={itens:[],difCols:new Set(),falt:new Set(),sobr:new Set(),ordem:-1};
 const nE=exp.cols.length,nG=got.cols.length,rE=exp.rows.length,rG=got.rows.length,lc=s=>String(s).toLowerCase();
 if(nE!==nG){
  d.itens.push(`Sua consulta trouxe <b>${pl(nG,'coluna')}</b>; o esperado são <b>${nE}</b>.`);
  const fal=exp.cols.filter(c=>!got.cols.some(g=>lc(g)===lc(c))),sob=got.cols.filter(c=>!exp.cols.some(g=>lc(g)===lc(c)));
  if(fal.length&&fal.length<=6)d.itens.push(`Colunas esperadas que não vieram: ${fal.map(c=>`<code>${esc(c)}</code>`).join(', ')}.`);
  if(nG>nE&&nG>=6)d.itens.push('Dica: troque o <code>*</code> pela lista só das colunas pedidas, na ordem do enunciado.');
  else if(sob.length&&sob.length<=4)d.itens.push(`Colunas a mais: ${sob.map(c=>`<code>${esc(c)}</code>`).join(', ')}.`);
 }
 if(!rG&&rE)d.itens.push(`Sua consulta não trouxe nenhuma linha; o esperado são <b>${rE}</b>. Confira o filtro do WHERE (textos entre aspas, maiúsculas e acentos) e o ON dos JOINs.`);
 else if(rE!==rG)d.itens.push(`Você trouxe <b>${pl(rG,'linha')}</b>; o esperado são <b>${rE}</b>.`);
 if(nE===nG&&rG){
  const mapa=new Map();exp.rows.forEach((r,i)=>{const k=linhaSig(r);if(!mapa.has(k))mapa.set(k,[]);mapa.get(k).push(i)});
  got.rows.forEach((r,i)=>{const l=mapa.get(linhaSig(r));if(l&&l.length)l.shift();else d.sobr.add(i)});
  mapa.forEach(l=>l.forEach(i=>d.falt.add(i)));
  const conjE=new Set(exp.rows.map(linhaSig));
  if(!d.sobr.size&&!d.falt.size){
   if(ord){d.ordem=got.rows.findIndex((r,i)=>linhaSig(r)!==linhaSig(exp.rows[i]));d.itens.push(`As linhas estão certas, mas a <b>ordem</b> não (a diferença começa na linha ${d.ordem+1}). Confira o ORDER BY: a coluna e o sentido ASC/DESC.`)}
  }else if(!d.falt.size){
   const dup=[...d.sobr].every(i=>conjE.has(linhaSig(got.rows[i])));
   const um=d.sobr.size===1;d.itens.push(dup?`${um?'Veio':'Vieram'} <b>${pl(d.sobr.size,'linha repetida','linhas repetidas')}</b>: um JOIN multiplicou as linhas ou faltou um DISTINCT.`:`Todas as linhas esperadas estão aí, mas ${um?'sobrou':'sobraram'} <b>${pl(d.sobr.size,'linha')}</b>: falta filtrar (WHERE, ON do JOIN ou HAVING).`);
  }else if(!d.sobr.size){
   d.itens.push(`${d.falt.size===1?'Faltou':'Faltaram'} <b>${pl(d.falt.size,'linha')}</b>: o filtro ficou restritivo demais ou o JOIN descartou linhas (precisava de LEFT JOIN?).`);
  }else{
   exp.cols.forEach((c,j)=>{const a=exp.rows.map(r=>celSig(r[j])).sort().join('␞'),b=got.rows.map(r=>celSig(r[j])).sort().join('␞');if(a!==b)d.difCols.add(j)});
   if(d.difCols.size&&d.difCols.size<nE){
    const j=[...d.difCols][0],cnt=new Map();exp.rows.forEach(r=>{const k=celSig(r[j]);cnt.set(k,(cnt.get(k)||0)+1)});
    let seu=null;for(const r of got.rows){const k=celSig(r[j]);if(cnt.get(k))cnt.set(k,cnt.get(k)-1);else{seu=r[j];break}}
    const ex=exp.rows.find(r=>!got.rows.some(g=>celSig(g[j])===celSig(r[j])));
    d.itens.push(`As outras colunas batem; a diferença está em ${[...d.difCols].map(k=>`<code>${esc(exp.cols[k])}</code>`).join(', ')}${seu!==undefined&&seu!==null&&ex?` (ex.: você tem <b>${esc(fmt(seu))}</b> onde o esperado tem <b>${esc(fmt(ex[j]==null?'NULL':ex[j]))}</b>)`:''}. Revise o cálculo, a função ou a coluna usada.`);
   }else d.itens.push(`${pl(d.falt.size,'linha esperada não apareceu','linhas esperadas não apareceram')} e ${pl(d.sobr.size,'linha sua não existe','linhas suas não existem')} no gabarito. Compare os resultados lado a lado.`);
  }
  const nE0=exp.rows.some(r=>r.some(v=>v==null)),nG0=got.rows.some(r=>r.some(v=>v==null));
  if(nE0&&!nG0&&d.falt.size)d.itens.push('O esperado tem valores NULL que sumiram do seu: <code>= NULL</code> nunca é verdadeiro (use IS NULL) e o INNER JOIN descarta quem não tem par.');
 }

}

function planoConsulta(sql){
 let s=String(sql||'').replace(/\s+$/,'');while(/;\s*$/.test(s))s=s.replace(/;\s*$/,'');
 const n=s.length,f=[];let d=0;
 for(let i=0;i<n;i++){const c=s[i];
  if(c==="'"){let j=i+1;while(j<n){if(s[j]==="'"){if(s[j+1]==="'"){j+=2;continue}break}j++}j=Math.min(j,n-1);for(let k=i;k<=j;k++)f.push(' ');i=j;continue}
  if(c==='-'&&s[i+1]==='-'){let j=s.indexOf('\n',i);if(j<0)j=n;for(let k=i;k<j;k++)f.push(' ');i=j-1;continue}
  if(c==='/'&&s[i+1]==='*'){let j=s.indexOf('*/',i+2);j=j<0?n:j+2;for(let k=i;k<j;k++)f.push(' ');i=j-1;continue}
  if(c==='['){let j=s.indexOf(']',i);if(j<0)j=n-1;for(let k=i;k<=j;k++)f.push(' ');i=j;continue}

 UNITS.forEach((u,ui)=>{
  const locked=cur&&ui>cur.ui,nd=u.L.filter((l,li)=>S.done[K(ui,li)]).length,sign=ui%2?-1:1,offs=u.L.map((_,i)=>Math.round(Math.sin(i*0.9)*88)).concat([Math.round(Math.sin(u.L.length*0.9)*88)]);

function layoutER(T){
 const W=184,RH=21,HH=34,GX=86,GY=26,by=new Map(T.map(t=>[t.nome.toLowerCase(),t]));
 const rank=new Map(),visita=new Set();
 const rk=t=>{const k=t.nome.toLowerCase();if(rank.has(k))return rank.get(k);if(visita.has(k))return 0;visita.add(k);
  let r=0;t.fks.forEach(f=>{const p=by.get(String(f.tab).toLowerCase());if(p&&p!==t)r=Math.max(r,rk(p)+1)});rank.set(k,r);return r};
 T.forEach(rk);
 const viz=t=>T.filter(o=>o!==t&&(t.fks.some(f=>String(f.tab).toLowerCase()===o.nome.toLowerCase())||o.fks.some(f=>String(f.tab).toLowerCase()===t.nome.toLowerCase())));
 const cols=[];T.forEach(t=>{const r=rank.get(t.nome.toLowerCase());(cols[r]=cols[r]||[]).push(t)});
 for(let c=0;c<cols.length;c++)if(!cols[c])cols[c]=[];
 const pos=new Map();const ord=()=>cols.forEach(cl=>cl.forEach((t,i)=>pos.set(t,i)));ord();
 for(let v=0;v<4;v++){cols.forEach(cl=>{cl.forEach(t=>{const n=viz(t);t._b=n.length?n.reduce((s,o)=>s+pos.get(o),0)/n.length:999+pos.get(t)});cl.sort((a,b)=>a._b-b._b)});ord()}
 let largura=0,altura=0;
 cols.forEach((cl,c)=>{let y=18;cl.forEach(t=>{t.x=18+c*(W+GX);t.y=y;t.w=W;t.h=HH+t.cols.length*RH+8;y+=t.h+GY;largura=Math.max(largura,t.x+W+18)});altura=Math.max(altura,y)});
 const linhaY=(t,col)=>{const i=Math.max(0,t.cols.findIndex(c=>c.n.toLowerCase()===String(col||'').toLowerCase()));return t.y+HH+i*RH+RH/2+2};
 const arestas=[];
 T.forEach(t=>t.fks.forEach(f=>{const p=by.get(String(f.tab).toLowerCase());if(!p)return;const pk=f.para||(p.cols.find(c=>c.pk)||p.cols[0]||{}).n;
  const y1=linhaY(t,f.de),y2=linhaY(p,pk);let d;
  if(p===t){const x=t.x+W;d=`M${x} ${y1} C${x+46} ${y1} ${x+46} ${y2} ${x} ${y2}`}
  else if(p.x<t.x){const x1=t.x,x2=p.x+W,m=(x1-x2)/2;d=`M${x1} ${y1} C${x1-m} ${y1} ${x2+m} ${y2} ${x2} ${y2}`}
  else{const x1=t.x+W,x2=p.x+W,m=Math.max(46,Math.abs(y2-y1)/3);d=`M${x1} ${y1} C${x1+m} ${y1} ${x2+m} ${y2} ${x2} ${y2}`}
  arestas.push({de:t.nome,para:p.nome,col:f.de,pk,d,x1:p===t?t.x+W:(p.x<t.x?t.x:t.x+W),y1,x2:p.x+W,y2,auto:p===t})}));
 return{W:largura,H:altura,arestas,RH,HH}}

  t.cols.forEach((col,i)=>{const y=t.y+L.HH+i*L.RH+15,fk=t.fks.some(f=>f.de.toLowerCase()===col.n.toLowerCase());

  h+='</g>'});
 return h+'</svg>'}

function validarCadastro(b){
 const nome=String(b.nome||'').trim().replace(/\s+/g,' ');
 if(nome.length<5||!nome.includes(' '))return 'Informe o nome completo (nome e sobrenome) — ele vai no certificado.';
 if(!/^[A-Za-z0-9_.]{3,20}$/.test(String(b.apelido||'').trim()))return 'O apelido deve ter de 3 a 20 caracteres: letras, números, ponto ou _.';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(String(b.email||'').trim()))return 'Informe um e-mail válido.';
 const s=String(b.senha||'');if(s.length<8||!/[A-Za-z]/.test(s)||!/\d/.test(s))return 'A senha precisa de pelo menos 8 caracteres, com letras e números.';
 if(!b.aceite_termos)return 'É preciso aceitar os termos de uso e a política de privacidade.';

}

/* ---------- backup do progresso: exportar e importar (modo demonstração) ----------
   No modo demonstração o progresso fica só neste navegador. O aluno exporta um arquivo .json
   e importa em outro computador. O arquivo leva aulas, XP, provas, certificados, projetos,
   entrevistas, avatar e rascunhos do laboratório. A senha vai apenas como código (hash). */
const BKP={tipo:'sqlito-backup-progresso',formato:1};
const bkpLocal=id=>{const o={};Object.keys(localStorage).forEach(k=>{let m;
  if((m=k.match(/^hm\.(avatar|cache|fila|dia|cobra)\.(\d+)$/))&&+m[2]===id)o[`hm.${m[1]}.{ID}`]=localStorage.getItem(k);
  else if((m=k.match(/^hm\.proj\.(\d+)\.(.+)$/))&&+m[1]===id)o[`hm.proj.{ID}.${m[2]}`]=localStorage.getItem(k);
  else if(/^hm\.lab\./.test(k))o[k]=localStorage.getItem(k)});return o};
const bkpSoma=c=>Demo.hash(JSON.stringify(c));
async function exportarProgresso(){
 if(API.mode!=='demo'){toast('Seu progresso já fica salvo na sua conta.');return}
 if(fila.length){try{await sincronizar(true)}catch(e){}}
 const d=Demo.db(),id=S.aluno&&S.aluno.id,a=d.alunos.find(x=>x.id===id);if(!a){toast('Não encontrei sua conta neste navegador.');return}
 const doAluno=k=>(d[k]||[]).filter(x=>x.aluno===id).map(({aluno,...r})=>r);
 const conteudo={aluno:{nome:a.nome,apelido:a.apelido,email:a.email,senha:a.senha,vidas:a.vidas,som:a.som,trilha:a.trilha,criado:a.criado,port_publico:a.port_publico?1:0},
  t:doAluno('t'),provas:doAluno('provas'),certs:doAluno('certs'),port:doAluno('port'),ent:doAluno('ent'),local:bkpLocal(id)};
 const xp=conteudo.t.reduce((s,t)=>s+t.xp,0),aulas=new Set(conteudo.t.map(t=>t.licao)).size;
 const arq={app:'SQLito',...BKP,exportado_em:new Date().toISOString(),resumo:{apelido:a.apelido,aulas,xp,certificados:conteudo.certs.length},conteudo,verificacao:bkpSoma(conteudo)};
 const url=URL.createObjectURL(new Blob([JSON.stringify(arq,null,1)],{type:'application/json'})),l=document.createElement('a');
 l.href=url;l.download=`sqlito-progresso-${a.apelido}-${day()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
 S.bkpAt=new Date().toISOString();save();toast(`Backup salvo: ${aulas} aulas, ${fmtXP(xp)} XP e ${conteudo.certs.length} certificado(s).`);if(tab==='me')render();
}

async function importarBackup(c){

  a={id:d.seq++,nome:c.aluno.nome,apelido:ap,email:em,senha:c.aluno.senha,vidas:c.aluno.vidas??5,som:c.aluno.som??1,trilha:c.aluno.trilha||null,criado:c.aluno.criado||new Date().toISOString(),port_publico:c.aluno.port_publico?1:0};d.alunos.push(a)}
 else if(!a.trilha&&c.aluno.trilha)a.trilha=c.aluno.trilha;
 const id=a.id;let n=0;
 (c.t||[]).forEach(t=>{if(!d.t.some(x=>x.id===t.id)){d.t.push({...t,aluno:id});n++}});
 (c.provas||[]).forEach(p=>{if(!d.provas.some(x=>x.id===p.id))d.provas.push({...p,aluno:id})});
 (c.certs||[]).forEach(k=>{if(!d.certs.some(x=>x.aluno===id&&x.nivel===k.nivel&&(x.trilha||'hotel')===(k.trilha||'hotel')))d.certs.push({...k,aluno:id,nome:k.nome||a.nome})});
 d.port=d.port||[];(c.port||[]).forEach(p=>{const i=d.port.findIndex(x=>x.aluno===id&&x.projeto_id===p.projeto_id);if(i<0)d.port.push({...p,aluno:id});else if((p.em||'')>(d.port[i].em||''))d.port[i]={...p,aluno:id}});
 d.ent=d.ent||[];(c.ent||[]).forEach(e=>{if(!d.ent.some(x=>x.client_id===e.client_id))d.ent.push({...e,aluno:id})});
 const tok='demo-'+uuid();d.sess[tok]=id;LS.set(Demo.K,d);
 Object.entries(c.local||{}).forEach(([k,v])=>{const kk=k.replace('{ID}',id);if(!/^hm\.(avatar|cache|fila|dia|cobra|proj|lab)\./.test(kk)||typeof v!=='string')return;
  if(kk.startsWith('hm.fila.')){let atual=[],vem=[];try{atual=JSON.parse(localStorage.getItem(kk)||'[]');vem=JSON.parse(v)}catch(e){}
   const ids=new Set(atual.map(x=>x.client_id));localStorage.setItem(kk,JSON.stringify(atual.concat(vem.filter(x=>!ids.has(x.client_id)))));return}
  if(localStorage.getItem(kk)==null)localStorage.setItem(kk,v)});
 await entrarComSessao(tok,Demo.prog(Demo.db(),a));
 toast(`Progresso importado! ${n} aula(s) nova(s) neste computador.${novo?'':' Sua senha deste navegador continua a mesma.'}`);
}

/* ---------- sincronização entre aparelhos ---------- */
let fila=[],syncing=false,syncState='ok',lastSig='';
const fk=id=>'hm.fila.'+id;
const SYNC_TXT={ok:'Tudo sincronizado',pend:'Lições aguardando envio',sync:'Sincronizando',off:'Sem conexão, salvo neste aparelho'};
function setSync(s){syncState=s;const b=$('#sync');if(!b)return;b.dataset.s=s;b.innerHTML=ic(s==='sync'?'refresh':s==='off'?'cloudOff':'cloud')+(fila.length?`<i>${fila.length}</i>`:'');const t=SYNC_TXT[s]+(fila.length?` (${fila.length} pendente${fila.length>1?'s':''})`:'');b.setAttribute('aria-label',t);b.title=t}
function aplicar(p){
 S.aluno=p.aluno;S.xp=p.xp;S.streak=p.ofensiva;S.hearts=p.vidas;S.snd=p.som?1:0;S.acc=p.precisao;S.certs=p.certificados;S.trilhas=p.trilhas||[];S.ultima=p.ultima_atividade||S.ultima;
 if(p.trilha&&!S.trilhaLocal)S.trilha=p.trilha;const t=S.trilhas.find(x=>x.id===S.trilha);S.niveis=t?t.niveis:(p.niveis||[]);S.cargo=t?t.cargo:(p.cargo||'');
 S.done={};p.licoes_concluidas.forEach(k=>S.done[k]=1);
 fila.forEach(t=>{S.done[t.licao]=1;S.xp+=t.xp});
 S.syncAt=new Date().toISOString();save();
}
async function sincronizar(manual){
 if(!API.token||!S.aluno||syncing)return;syncing=true;setSync('sync');
 try{
  const p=await API.req('POST','progresso/sincronizar',{tentativas:fila.slice(0,300),vidas:S.hearts,som:!!S.snd,dispositivo:DEV,trilha:S.trilha||undefined});
  const ok=new Set([...(p.recebidas||[]),...(p.rejeitadas||[])]);fila=fila.filter(t=>!ok.has(t.client_id));LS.set(fk(p.aluno.id),fila);
  S.trilhaLocal=0;aplicar(p);syncing=false;setSync(fila.length?'pend':'ok');if(manual)toast('Progresso sincronizado.');refresh();
  if(fila.length)setTimeout(sincronizar,800);
 }catch(e){syncing=false;if(e.status===401){sessaoExpirada();return}setSync('off');if(manual)toast(e.message)}
}

/* ---------- conta: apelido, foto/avatar e sair (cabeçalho, canto superior direito) ---------- */
const AVATARES=['🦉','🦊','🐼','🐨','🐯','🦁','🐸','🐧','🐱','🐶','🐵','🦄','🐙','🐢','🦖','🤖','🐝','🐳'];
const AVCORES=['#1E6BFF','#F2674A','#8B78EE','#2F95D8','#D99A1E','#4F6B80','#D9478A','#0F9D9A','#B7791F'];
const avKey=id=>'hm.avatar.'+id;
const avDe=a=>a&&a.id!=null?LS.get(avKey(a.id),null):null;
const corDe=ap=>AVCORES[Array.from(ap||'?').reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%AVCORES.length];
/** Avatar do aluno: foto, avatar escolhido ou a inicial do apelido. t = tamanho em px. */
function avatarHTML(a,t=34){
 a=a||{};const v=avDe(a),ap=a.apelido||a.nome||'?',st=`--t:${t}px`;
 if(v&&v.tipo==='foto'&&v.src)return `<span class="ava" style="${st}"><img src="${v.src}" alt=""></span>`;

 return `<span class="ava" style="${st};--ac:${corDe(ap)}" aria-hidden="true">${esc(ap[0].toUpperCase())}</span>`;
}

 hdr();menuConta(true);if(tab==='me'||tab==='rank')render();
}
/** Reduz a foto para 192×192 (recorte central, JPEG) para caber no armazenamento do navegador. */
function lerFoto(arq){
 if(!arq)return;
 if(!/^image\//.test(arq.type)){toast('Escolha um arquivo de imagem (JPG, PNG ou WEBP).');return}
 if(arq.size>15*1024*1024){toast('Imagem muito grande. Use uma de até 15 MB.');return}
 const url=URL.createObjectURL(arq),img=new Image();
 img.onload=()=>{const T=192,c=document.createElement('canvas');c.width=c.height=T;const l=Math.min(img.width,img.height);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,T,T);g.drawImage(img,(img.width-l)/2,(img.height-l)/2,l,l,0,0,T,T);
  URL.revokeObjectURL(url);salvarAvatar({tipo:'foto',src:c.toDataURL('image/jpeg',.86)});toast('Foto atualizada!')};
 img.onerror=()=>{URL.revokeObjectURL(url);toast('Não consegui abrir essa imagem.')};
 img.src=url;
}
function menuConta(abrir){
 const box=$('#conta');if(!box)return;
 const a=S.aluno;if(!a){box.innerHTML='';return}
 const aberto=abrir===undefined?!!box.querySelector('.cmenu.on'):abrir,v=avDe(a)||{};
 box.innerHTML=`<button class="contab" id="contaBtn" type="button" aria-haspopup="true" aria-expanded="${aberto}" title="Sua conta">${avatarHTML(a,34)}<span class="nm">${esc(a.apelido||a.nome||'Aluno')}</span><svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
 <div class="cmenu ${aberto?'on':''}" role="menu" aria-label="Sua conta">
  <div class="cab">${avatarHTML(a,58)}<div style="min-width:0"><b>${esc(a.nome||a.apelido||'')}</b><small>@${esc(a.apelido||'')}</small></div></div>
  <div class="tit">Foto ou avatar</div>
  <div class="acoes"><label>${ic('user')}Enviar foto<input type="file" id="contaFoto" accept="image/*" hidden></label>${v.tipo?`<button type="button" id="contaTirar">${ic('x')}Remover</button>`:''}</div>
  <div class="avgrid">${AVATARES.map((e,i)=>`<button type="button" data-av="${i}" aria-label="Avatar ${e}" aria-pressed="${v.tipo==='emoji'&&v.v===e}"><span class="ava em" style="--ac:${AVCORES[i%AVCORES.length]}">${e}</span></button>`).join('')}</div>
  <p class="nota">A foto fica salva neste navegador.</p>
  <button class="item" type="button" id="contaPerfil" role="menuitem">${ic('user')}Meu perfil</button>
  <button class="item sair" type="button" id="contaSair" role="menuitem">${ic('logout')}Sair da conta</button>
 </div>`;
 $('#contaBtn').onclick=e=>{e.stopPropagation();menuConta(!box.querySelector('.cmenu.on'))};
 box.querySelector('.cmenu').onclick=e=>e.stopPropagation();
 $('#contaFoto').onchange=e=>lerFoto(e.target.files[0]);
 const tirar=$('#contaTirar');if(tirar)tirar.onclick=()=>{salvarAvatar(null);toast('Foto removida.')};
 box.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{const i=+b.dataset.av;salvarAvatar({tipo:'emoji',v:AVATARES[i],cor:AVCORES[i%AVCORES.length]})});
 $('#contaPerfil').onclick=()=>{menuConta(false);tab='me';render();scrollTo(0,0)};
 $('#contaSair').onclick=()=>{menuConta(false);sair()};
}
document.addEventListener('click',()=>{const m=document.querySelector('#conta .cmenu.on');if(m)menuConta(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#conta .cmenu.on')){menuConta(false);$('#contaBtn').focus()}});

/* ---------- ranking ---------- */
const rk={per:'semana',data:null,loading:false,err:''};
const AVC=['#1E6BFF','#F2674A','#8B78EE','#2F95D8','#D99A1E','#4F6B80','#D9478A'];
const av=ap=>`<span class="av" style="--ac:${AVC[Array.from(ap).reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%AVC.length]}" aria-hidden="true">${esc(ap[0].toUpperCase())}</span>`;
const fmtXP=n=>(+n||0).toLocaleString('pt-BR');
const rrow=r=>`<div class="rrow ${r.eu?'me':''}"><span class="p">${r.posicao}º</span>${r.eu&&S.aluno?avatarHTML(S.aluno,40):av(r.apelido)}<span class="n">${esc(r.apelido)}${r.eu?' (você)':''}${r.licoes!==''?`<small>${r.licoes} ${r.licoes==1?'lição':'lições'}</small>`:''}</span><span class="pts"><b>${fmtXP(r.xp)}</b><small>XP</small></span></div>`;
function viewRank(){
 const d=rk.data&&rk.data.periodo===rk.per?rk.data:null;
 if(!d&&!rk.loading&&!rk.err)loadRank();
 const lider=d&&d.eu&&d.eu.posicao===1;
 let h=`<h1 class="h1">Ranking</h1><div class="say mini">${sqlito(evo(),lider?'happy':'idle')}<div class="bub">${lider?'Primeiro lugar?! Agora defende essa posição, que eu tô de olho!':'Ranking é comigo! Quem somar mais XP na semana fica no topo, valendo todas as trilhas. Bora subir?'}</div></div><p class="mute">${rk.per==='semana'?'XP ganho desde segunda-feira; o quadro recomeça toda semana.':'XP acumulado desde o cadastro.'} Os outros alunos veem só o seu apelido.</p><div class="seg rk" role="tablist" aria-label="Período"><button role="tab" data-rk="semana" aria-selected="${rk.per==='semana'}">Esta semana</button><button role="tab" data-rk="geral" aria-selected="${rk.per==='geral'}">Geral</button></div>`;
 if(rk.err&&!d)return h+`<div class="err">${esc(rk.err)}</div><div class="row"><button class="btn ghost" data-rkre>Tentar de novo</button></div>`;
 if(!d)return h+'<p class="cap">Carregando o ranking…</p>';
 if(!d.itens.length)return h+`<div class="card" style="text-align:center"><div style="width:110px;margin:auto">${sqlito(evo(),'sleepy')}</div><p><b>Ninguém pontuou ${rk.per==='semana'?'nesta semana':'ainda'}.</b><br>Conclua uma lição e abra o quadro!</p></div>`;
 const top=d.itens.slice(0,3),M=[['#F5B21B','#C98A00'],['#9FB3BC','#71878F'],['#DE8A4B','#A9622B']],H=[150,116,96];
 h+=`<div class="podium">${[1,0,2].map(i=>{const r=top[i];if(!r)return'<div></div>';const m=M[Math.min(r.posicao,3)-1];return `<div class="pod" style="--pc:${m[0]};--pd:${m[1]}">${av(r.apelido)}<div class="nm">${esc(r.apelido)}${r.eu?' (você)':''}</div><div class="bl" style="height:${H[i]}px"><b>${r.posicao}º</b><span class="pv">${fmtXP(r.xp)}</span><small>XP</small></div></div>`}).join('')}</div>`;
 h+=`<div class="rlist">${d.itens.slice(3).map(rrow).join('')}</div>`;
 if(d.eu&&!d.itens.some(r=>r.eu))h+=`<div class="mebar">${rrow({posicao:d.eu.posicao,apelido:S.aluno.apelido,xp:d.eu.xp,licoes:'',eu:true})}</div>`;
 else if(!d.eu)h+=`<p class="cap">Você ainda não pontuou ${rk.per==='semana'?'nesta semana':''}. Conclua uma lição para entrar no quadro.</p>`;
 return h;
}
async function loadRank(){rk.loading=true;rk.err='';try{rk.data=await API.req('GET','ranking?periodo='+rk.per)}catch(e){if(e.status===401){rk.loading=false;sessaoExpirada();return}rk.err=e.message}rk.loading=false;if(tab==='rank'&&!L)render()}
function bindRank(){document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{if(rk.per!==b.dataset.rk){rk.per=b.dataset.rk;rk.data=null;rk.err='';render()}});const re=document.querySelector('[data-rkre]');if(re)re.onclick=()=>{rk.err='';rk.data=null;render()}}

/* ---------- certificados e prova ---------- */
function viewCert(){
 const T=TRI(S.trilha),meus=(S.certs||[]).filter(c=>(c.trilha||'hotel')===S.trilha);
 let h=`<h1 class="h1">Certificados</h1><p class="mute">Trilha ${T.nome}: conclua as etapas de cada nível e seja aprovado na prova para receber o certificado. Cada trilha tem seus próprios certificados.</p><div style="margin-top:18px">`;
 niveisDe(S.trilha).forEach(N=>{
  const ls=licoesDoNivel(N),f=ls.filter(x=>S.done[x.key]).length,info=(S.niveis||[]).find(n=>n.id===N.id)||{},cert=meus.find(c=>c.nivel_id===N.id),lib=f===ls.length;
  h+=`<section class="lv ${cert||lib?'':'lk'}" style="--lc:${N.c};--ld:${N.d}"><div class="sl">${sqlito(N.f,cert?'happy':'')}</div><div><h3>Nível ${N.nome}</h3><p>${etapasTxt(N)} · ${N.q} questões · nota mínima ${nota(N.min)} · ${N.carga} h</p><div class="meter" role="progressbar" aria-label="Lições concluídas do nível ${N.nome}" aria-valuenow="${f}" aria-valuemax="${ls.length}"><i style="width:${f/ls.length*100}%"></i></div>
  <div class="row">${cert?`<span class="st ok">${ic('check')}Aprovado com nota ${nota(cert.nota)}</span><button class="btn" data-cert="${N.id}">${ic('medal')}Ver certificado</button>`:lib?`<span class="st go">Prova liberada${info.melhor_nota!=null?` · melhor nota ${nota(info.melhor_nota)}`:''}</span><button class="btn" data-prova="${N.id}">${ic('play')}${info.provas_feitas?'Tentar de novo':'Fazer a prova'}</button>`:`<span class="st lk">${ic('lock')}Faltam ${ls.length-f} de ${ls.length} lições</span>`}</div></div></section>`;
 });
 return h+`</div><div class="rules"><b>Como funciona a prova</b><ul><li>${NIVEIS[0].q} questões sorteadas das etapas do nível: múltipla escolha, montagem e código.</li><li>Não gasta energia, sem dicas e sem correção durante a prova; o botão Executar continua disponível.</li><li>Nota mínima ${nota(7)}. Se não passar, revise as lições e tente de novo quando quiser.</li><li>O certificado traz seu nome completo, a nota, a carga horária e um código de verificação.</li></ul></div>`;
}
function bindCert(){document.querySelectorAll('[data-prova]').forEach(b=>b.onclick=()=>startProva(+b.dataset.prova));document.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>showCert((S.certs||[]).find(c=>c.nivel_id===+b.dataset.cert&&(c.trilha||'hotel')===S.trilha)))}
function startProva(n){
 const N=NIVEIS[n-1],pools=[];for(let e=N.et[0];e<=N.et[1];e++)pools.push(shuffle(UNITS[e-1].L.flatMap(l=>l.q)));
 const sel=[];for(let k=0;sel.length<N.q&&k<1000;k++){const p=pools[k%pools.length];if(p.length)sel.push(p.pop())}
 const qs=shuffle(sel);
 L={mode:'prova',nivel:n,trilha:S.trilha,ui:N.et[0]-1,li:0,key:'prova-'+n,les:{t:'Prova Nível '+N.nome,q:qs},queue:qs.map((_,i)=>i),done:0,total:qs.length,step:'intro',ok:0,bad:0,combo:0,gain:0,t0:Date.now(),cid:uuid()};
 const el=$('#lesson');el.style.setProperty('--u',N.c);el.style.setProperty('--ud',N.d);el.hidden=false;document.body.style.overflow='hidden';$('#lHearts').style.visibility='hidden';bar();
 lb().innerHTML=`<div class="q"><span class="kind">${ic('medal')}Prova de certificação</span><h2>Nível ${N.nome}</h2><div class="say">${sqlito(evo(),'idle')}<div class="bub">Hora da verdade! São ${N.q} questões das etapas ${etapasTxt(N)}. Duvido você tirar 10. Com nota ${nota(N.min)} ou mais, o certificado sai na hora.</div></div><div class="rules"><ul><li>Não gasta energia e não tem dicas: as respostas só são corrigidas no final.</li><li>Nos desafios de código você pode usar o botão Executar.</li><li>Se sair no meio, a prova é descartada e pode ser refeita.</li></ul></div></div>`;
 foot('','','Começar a prova');lb().scrollTop=0;
}
async function finishProva(){
 L.step='enviando';const N=NIVEIS[L.nivel-1],sec=Math.round((Date.now()-L.t0)/1000);bar();
 lb().innerHTML=`<div class="fin">${sqlito(evo(),'idle')}<h2 style="color:var(--ink)">Corrigindo sua prova…</h2></div>`;foot('','','Aguarde',true);
 try{L.result=await API.req('POST','provas',{client_id:L.cid,trilha:L.trilha,nivel:L.nivel,acertos:L.ok,total:L.total,duracao_s:sec})}
 catch(e){if(e.status===401){sessaoExpirada();return}if(!L)return;L.step='reenviar';lb().innerHTML=`<div class="fin">${sqlito(evo(),'sad')}<h2 style="color:var(--bad-ink)">Não consegui enviar</h2><p>${esc(e.message)}</p><p class="mute">Suas respostas estão guardadas. Confira a conexão e ${clq} para enviar de novo.</p></div>`;foot('','','Enviar de novo');return}
 if(!L)return;const r=L.result;L.step='fin';
 lb().innerHTML=`<div class="fin">${sqlito(r.aprovado?N.f:evo(),r.aprovado?(N.id===niveisDe(S.trilha).length?'jedi':'happy'):'sad')}<h2 style="color:${r.aprovado?'var(--gold-d)':'var(--bad-ink)'}">${r.aprovado?(N.id===niveisDe(S.trilha).length?FRASE.dba:`Parabéns! Você desbloqueou o nível ${N.nome}!`):'Ainda não foi desta vez'}</h2><p class="mute">Prova do Nível ${N.nome}</p><div class="kpis"><div class="kpi" style="--k:${r.aprovado?'var(--gold-d)':'var(--bad)'}"><small>Nota</small><b>${nota(r.nota)}</b></div><div class="kpi" style="--k:var(--mint-d)"><small>Acertos</small><b>${r.acertos}/${r.total}</b></div><div class="kpi" style="--k:#2F95D8"><small>Mínimo</small><b>${nota(r.nota_minima)}</b></div></div><p>${r.aprovado?'Seu certificado foi emitido e já está na aba Certificados.':'Calma! Até os melhores DBAs já reprovaram numa prova. Revise as lições do nível e tente de novo: eu não vou deixar você desistir.'}</p></div>`;
 foot('','',r.certificado?'Ver meu certificado':'Voltar aos certificados');
 if(r.aprovado){tone(SND.win);confetti(120)}else tone(SND.bad);
 sincronizar();
}
function showCert(c){
 if(!c)return;const N=NIVEIS[c.nivel_id-1],box=$('#cert'),onl=API.mode==='api',T=TRI(c.trilha||'hotel'),et=c.etapas_texto||etapasDe(T.id,N);
 const pdf=onl?`${BASE}/api/certificados/${encodeURIComponent(c.codigo)}/pdf`:null,link=onl?`${BASE||location.origin}/certificado/${encodeURIComponent(c.codigo)}`:null;
 box.innerHTML=`<div class="cwrap"><div class="cbar ctop"><button class="btn ghost" id="cX">${ic('x')}Fechar</button></div>
 <article class="cert" style="--lc:${N.c}" aria-label="Certificado do Nível ${N.nome}">
  <div class="hd"><span class="tw">${sqlito(N.f,'')}</span><span>SQL<b>ito</b></span></div>
  <div class="seal"><small>Nota</small><b>${nota(c.nota)}</b><small>de 10,0</small></div>
  <p class="ey">Certificado de conclusão</p><h2>Nível ${N.nome} em SQL</h2><p class="lb">Certificamos que</p><div class="nm">${esc(c.nome)}</div>
  <p class="tx">concluiu as etapas ${et} da trilha ${T.nome}, na plataforma SQLito, e foi aprovado(a) na prova de certificação com nota ${nota(c.nota)}, totalizando carga horária estimada de ${c.carga_horaria} horas.</p>
  <div class="ft"><div><b>Emitido em ${dataBR(c.emitido_em)}</b><br>Código ${esc(c.codigo)}</div><div class="sg"><b>Coordenação Pedagógica</b><br>SQLito</div><div style="text-align:right">${onl?'Confira a autenticidade<br>pelo código ou QR do PDF':'Modo demonstração:<br>sem verificação pública'}</div></div>
 </article>
 <dl class="cdet"><div><dt>Aluno</dt><dd>${esc(c.nome)}</dd></div><div><dt>Certificado</dt><dd>Nível ${N.nome} em SQL · ${c.carga_horaria} h</dd></div><div><dt>Trilha</dt><dd>${T.nome}</dd></div><div><dt>Nota</dt><dd>${nota(c.nota)}</dd></div><div><dt>Emitido em</dt><dd>${dataBR(c.emitido_em)}</dd></div><div><dt>Código de verificação</dt><dd>${esc(c.codigo)}</dd></div></dl>
 <div class="cbar">${pdf?`<a class="btn" href="${pdf}" target="_blank" rel="noopener">${ic('download')}Baixar PDF</a><button class="btn ghost" id="cCopy">${ic('copy')}Copiar link de verificação</button>`:''}<a class="btn li" href="${esc(linkLinkedIn(c,N,T,link))}" target="_blank" rel="noopener">${ic('share')}Adicionar ao LinkedIn</a></div>
 ${pdf?'':'<p class="cnote">O PDF com QR Code e a página pública de verificação ficam disponíveis quando o app roda no servidor do SQLito.</p>'}</div>`;
 box.classList.add('on');document.body.style.overflow='hidden';box.scrollTop=0;
 $('#cX').onclick=closeCert;box.onclick=e=>{if(e.target===box)closeCert()};$('#cX').focus();
 if($('#cCopy'))$('#cCopy').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link de verificação copiado!')}catch(e){toast(link)}};
 confetti(50);
}
function closeCert(){$('#cert').classList.remove('on');if(!L)document.body.style.overflow=''}

/* ---------- início ---------- */
hdr();setSync('ok');
(async()=>{
 await API.init();
 if(API.mode==='api'&&API.banco===false)toast('O banco de dados está iniciando ou indisponível. No primeiro acesso do dia ele pode levar até 1 minuto: aguarde e tente de novo.');
 if(!API.token){showAuth('entrar');return}
 const ult=LS.get('hm.ultimo',null),c=ult!=null&&LS.get('hm.cache.'+ult,null);
 if(c&&c.aluno){S=Object.assign(def(),c);fila=LS.get(fk(ult),[]);if(S.trilha)carregarTrilha(S.trilha).then(()=>{if(!UNITS.length&&S.trilha){usarTrilha(S.trilha);render()}}).catch(()=>{});render()}
 try{
  const p=await API.req('GET','progresso');
  if(!c||!c.aluno||p.aluno.id!==ult){S=Object.assign(def(),LS.get('hm.cache.'+p.aluno.id,{}))}
  fila=LS.get(fk(p.aluno.id),[]);aplicar(p);LS.set('hm.ultimo',p.aluno.id);diaNovo();lastSig='';setSync(fila.length?'pend':'ok');
  if(fila.length)sincronizar();
  await abrirTrilha();
 }catch(e){
  if(e.status===401){sessaoExpirada();return}
  if(S.aluno){setSync('off');toast('Sem conexão: usando o progresso salvo neste aparelho.');await abrirTrilha()}else showAuth('entrar',e.message);
 }
})();
setInterval(()=>{if(document.visibilityState==='visible'&&!L&&API.token)sincronizar()},45000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!L&&API.token)sincronizar()});
addEventListener('online',()=>{if(API.token)sincronizar()});
addEventListener('offline',()=>setSync('off'));

}
